<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#05060a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Launchpad" />
<title>Launchpad</title>
<link rel="stylesheet" href="launchpad.css" />
<style>
  html,body{margin:0;padding:0;background:#05060a;height:100%;overscroll-behavior-y:contain}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#98a2b8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:.9rem;gap:10px}
  #boot .ring{width:18px;height:18px;border-radius:50%;border:2px solid rgba(124,92,255,.25);border-top-color:#7c5cff;animation:brot .8s linear infinite}
  @keyframes brot{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app-root"><div id="boot"><span class="ring"></span>Loading Launchpad…</div></div>
<script>
/* ══════════════════════════════════════════════════════════════════
   LAUNCHPAD_CONFIG — optional built-in connection.
   Fill this in ONCE and every device/browser auto-loads your apps,
   even ones that clear their storage (incognito, "delete on exit").

     user / repo / branch / path → where launchpad.json lives
     pat → your fine-grained PAT (Contents: Read and write).

   ⚠ If you embed the PAT, anyone who obtains THIS PAGE'S URL can
   read/write that one repo. Fine for a private personal link; leave
   pat empty if you share the URL publicly (devices then connect
   once via Settings → Connect, as before).
   ══════════════════════════════════════════════════════════════════ */
window.LAUNCHPAD_CONFIG = Object.assign({
  user: '',            // e.g. 'your-username'
  repo: '',            // e.g. 'my-private-vault'
  branch: 'main',
  path: '',            // subfolder, e.g. 'apps/launchpad'
  pat: ''              // e.g. 'github_pat_…' (optional — see warning)
}, window.LAUNCHPAD_CONFIG || {});
</script>
<script src="launchpad.js"></script>
